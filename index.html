<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>野球スコアボード</title>
<style>
:root { --line:#222; --blue:#eaf3ff; --red:#fff0f0; }
* { box-sizing:border-box; }
body { margin:0; padding:12px 8px 24px; font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif; color:#111; background:#fff; }
h1 { text-align:center; font-size:25px; margin:4px 0 14px; }
.wrap { width:100%; overflow-x:auto; }
table { width:100%; border-collapse:collapse; table-layout:fixed; min-width:0; }
th,td { border:2px solid var(--line); text-align:center; padding:0; height:62px; font-size:clamp(17px,4.4vw,23px); font-weight:700; }
thead th { height:46px; background:#f1f1f1; font-size:clamp(15px,3.8vw,20px); }
.teamcol { width:28%; }
.totalcol { width:12%; }
.teamname { width:100%; min-width:0; border:0; background:transparent; text-align:center; font-size:clamp(16px,4vw,21px); font-weight:800; padding:6px 1px; }
.score { width:100%; height:100%; border:0; background:transparent; font-size:clamp(22px,6vw,30px); font-weight:800; color:#111; padding:0; }
.score:active { background:#dcecff; }
.total { font-size:clamp(22px,5.5vw,29px); background:#fff8d9; }
.actions { display:flex; gap:8px; justify-content:center; margin:14px 0 8px; flex-wrap:wrap; }
button { touch-action:manipulation; }
.action { border:0; border-radius:9px; padding:12px 18px; font-size:17px; font-weight:700; background:#e8e8e8; }
.action.reset { background:#ffe2e2; }
.hint { text-align:center; font-size:14px; color:#555; margin:8px 0 0; }
dialog { border:0; border-radius:16px; padding:18px; width:min(340px,92vw); box-shadow:0 8px 40px #0004; }
dialog::backdrop { background:#0007; }
#editingTitle { text-align:center; font-size:20px; font-weight:800; margin:0 0 12px; }
#entry { width:100%; border:2px solid #888; border-radius:10px; padding:10px; text-align:center; font-size:34px; font-weight:800; margin-bottom:12px; min-height:62px; }
.keypad { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.key { min-height:54px; border:0; border-radius:10px; background:#eee; font-size:25px; font-weight:800; }
.key.special { background:#dcecff; font-size:18px; }
.key.cross { background:#ffe3e3; }
.dialogActions { display:flex; gap:8px; margin-top:12px; }
.dialogActions button { flex:1; border:0; border-radius:10px; padding:13px 8px; font-size:17px; font-weight:800; }
.cancel { background:#eee; } .confirm { background:#cfead5; }
@media (max-width:370px) {
 body { padding-left:4px; padding-right:4px; }
 th,td { height:55px; }
 .teamcol { width:26%; } .totalcol { width:12%; }
}
</style>
</head>
<body>
<h1>野球スコアボード</h1>
<div class="wrap">
<table id="board">
<thead><tr><th class="teamcol">チーム</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>8</th><th>9</th><th class="totalcol">計</th></tr></thead>
<tbody>
<tr><th><input class="teamname" id="team0" value="先攻" maxlength="7" aria-label="先攻チーム名"></th><td><button class="score" data-team="0" data-inning="0"></button></td><td><button class="score" data-team="0" data-inning="1"></button></td><td><button class="score" data-team="0" data-inning="2"></button></td><td><button class="score" data-team="0" data-inning="3"></button></td><td><button class="score" data-team="0" data-inning="4"></button></td><td><button class="score" data-team="0" data-inning="5"></button></td><td><button class="score" data-team="0" data-inning="6"></button></td><td><button class="score" data-team="0" data-inning="7"></button></td><td><button class="score" data-team="0" data-inning="8"></button></td><td class="total" id="total0">0</td></tr>
<tr><th><input class="teamname" id="team1" value="後攻" maxlength="7" aria-label="後攻チーム名"></th><td><button class="score" data-team="1" data-inning="0"></button></td><td><button class="score" data-team="1" data-inning="1"></button></td><td><button class="score" data-team="1" data-inning="2"></button></td><td><button class="score" data-team="1" data-inning="3"></button></td><td><button class="score" data-team="1" data-inning="4"></button></td><td><button class="score" data-team="1" data-inning="5"></button></td><td><button class="score" data-team="1" data-inning="6"></button></td><td><button class="score" data-team="1" data-inning="7"></button></td><td><button class="score" data-team="1" data-inning="8"></button></td><td class="total" id="total1">0</td></tr>
</tbody></table>
</div>
<div class="actions"><button class="action reset" id="reset">リセット</button></div>
<p class="hint">マスをタップして点数を入力（2桁まで）</p>
<dialog id="dlg">
<p id="editingTitle">点数入力</p>
<div id="entry"></div>
<div class="keypad">
<button class="key" data-key="1">1</button><button class="key" data-key="2">2</button><button class="key" data-key="3">3</button>
<button class="key" data-key="4">4</button><button class="key" data-key="5">5</button><button class="key" data-key="6">6</button>
<button class="key" data-key="7">7</button><button class="key" data-key="8">8</button><button class="key" data-key="9">9</button>
<button class="key special" data-key="back">1字戻す</button><button class="key" data-key="0">0</button><button class="key cross" data-key="x">×</button>
</div>
<div class="dialogActions"><button class="cancel" id="clear">空欄</button><button class="cancel" id="cancel">取消</button><button class="confirm" id="ok">決定</button></div>
</dialog>
<script>
const cells = [...document.querySelectorAll('.score')];
const values = Array.from({length:2},()=>Array(9).fill(''));
let active = null, draft = '';
const dlg = document.getElementById('dlg'), entry = document.getElementById('entry');
function render(){
 cells.forEach(b=>{const t=+b.dataset.team,i=+b.dataset.inning;b.textContent=values[t][i];});
 for(let t=0;t<2;t++) document.getElementById('total'+t).textContent=values[t].reduce((s,v)=>s+(v!==''&&v!=='×'&&!isNaN(Number(v))?Number(v):0),0);
 try{localStorage.setItem('baseballScoreboard',JSON.stringify({values,names:[team0.value,team1.value]}));}catch(e){}
}
function showDraft(){entry.textContent=draft==='×'?'×':draft;}
cells.forEach(b=>b.addEventListener('click',()=>{
 active={t:+b.dataset.team,i:+b.dataset.inning}; draft=values[active.t][active.i]; dlg.showModal(); showDraft();
}));
document.querySelectorAll('[data-key]').forEach(b=>b.addEventListener('click',()=>{
 const k=b.dataset.key;
 if(k==='x') draft='×';
 else if(k==='back') draft=draft==='×'?'':draft.slice(0,-1);
 else if(draft!=='×' && draft.length<2) draft+=k;
 showDraft();
}));
document.getElementById('ok').addEventListener('click',()=>{if(active){values[active.t][active.i]=draft;render();}dlg.close();});
document.getElementById('clear').addEventListener('click',()=>{if(active){values[active.t][active.i]='';render();}dlg.close();});
document.getElementById('cancel').addEventListener('click',()=>dlg.close());
document.getElementById('reset').addEventListener('click',()=>{
 if(confirm('スコアをすべてリセットしますか？')){values.forEach(r=>r.fill(''));team0.value='先攻';team1.value='後攻';render();}
});
document.querySelectorAll('.teamname').forEach(x=>x.addEventListener('input',render));
try{
 const saved=JSON.parse(localStorage.getItem('baseballScoreboard')||'null');
 if(saved){if(saved.values) saved.values.forEach((r,t)=>r.forEach((v,i)=>values[t][i]=v));if(saved.names){team0.value=saved.names[0]||'先攻';team1.value=saved.names[1]||'後攻';}}
}catch(e){}
render();
</script>
</body></html>
