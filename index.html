<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>野球スコアボード</title><style>
*{box-sizing:border-box}body{margin:0;padding:10px 4px 22px;font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#111}h1{text-align:center;font-size:24px;margin:4px 0 14px}table{width:100%;border-collapse:collapse;table-layout:fixed}th,td{border:2px solid #222;text-align:center;padding:0;height:58px;overflow:hidden}thead th{height:42px;background:#f1f1f1;font-size:clamp(12px,3.6vw,17px)}.teamcol{width:22%}.totalcol{width:10%}.teamname{width:100%;min-width:0;border:0;background:transparent;text-align:center;font-size:clamp(13px,3.8vw,17px);font-weight:800;padding:5px 0}.score{display:block;width:100%;height:100%;min-width:0;border:0;background:transparent;font-size:clamp(13px,4.1vw,17px);line-height:1;font-weight:800;color:#111;padding:0;white-space:nowrap}.score:active{background:#dcecff}.total{font-size:clamp(16px,4.6vw,21px);font-weight:800;background:#fff8d9}.actions{display:flex;justify-content:center;margin:14px 0 8px}.action{border:0;border-radius:9px;padding:12px 18px;font-size:17px;font-weight:700;background:#ffe2e2}.hint{text-align:center;font-size:14px;color:#555;margin:8px 0}dialog{border:0;border-radius:16px;padding:18px;width:min(340px,92vw);box-shadow:0 8px 40px #0004}dialog::backdrop{background:#0007}#editingTitle{text-align:center;font-size:20px;font-weight:800;margin:0 0 12px}#entry{border:2px solid #888;border-radius:10px;padding:10px;text-align:center;font-size:34px;font-weight:800;margin-bottom:12px;min-height:62px}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.key{min-height:54px;border:0;border-radius:10px;background:#eee;font-size:25px;font-weight:800}.special{background:#dcecff!important;font-size:18px!important}.cross{background:#ffe3e3!important}.dialogActions{display:flex;gap:8px;margin-top:12px}.dialogActions button{flex:1;border:0;border-radius:10px;padding:13px 8px;font-size:17px;font-weight:800}.cancel{background:#eee}.confirm{background:#cfead5}@media(max-width:360px){th,td{height:52px}.teamcol{width:21%}.totalcol{width:10%}.score{font-size:13px}}
</style></head><body><h1>野球スコアボード</h1><table><thead><tr><th class="teamcol">チーム</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>8</th><th>9</th><th class="totalcol">計</th></tr></thead><tbody>
<tr><th><input class="teamname" id="team0" value="先攻" maxlength="7"></th><td><button class="score" data-team="0" data-inning="0"></button></td><td><button class="score" data-team="0" data-inning="1"></button></td><td><button class="score" data-team="0" data-inning="2"></button></td><td><button class="score" data-team="0" data-inning="3"></button></td><td><button class="score" data-team="0" data-inning="4"></button></td><td><button class="score" data-team="0" data-inning="5"></button></td><td><button class="score" data-team="0" data-inning="6"></button></td><td><button class="score" data-team="0" data-inning="7"></button></td><td><button class="score" data-team="0" data-inning="8"></button></td><td class="total" id="total0">0</td></tr>
<tr><th><input class="teamname" id="team1" value="後攻" maxlength="7"></th><td><button class="score" data-team="1" data-inning="0"></button></td><td><button class="score" data-team="1" data-inning="1"></button></td><td><button class="score" data-team="1" data-inning="2"></button></td><td><button class="score" data-team="1" data-inning="3"></button></td><td><button class="score" data-team="1" data-inning="4"></button></td><td><button class="score" data-team="1" data-inning="5"></button></td><td><button class="score" data-team="1" data-inning="6"></button></td><td><button class="score" data-team="1" data-inning="7"></button></td><td><button class="score" data-team="1" data-inning="8"></button></td><td class="total" id="total1">0</td></tr></tbody></table>
<div class="actions"><button class="action" id="reset">リセット</button></div><p class="hint">マスをタップして点数を入力（2桁まで）</p>
<dialog id="dlg"><p id="editingTitle">点数入力</p><div id="entry"></div><div class="keypad">
<button class="key" data-key="1">1</button><button class="key" data-key="2">2</button><button class="key" data-key="3">3</button><button class="key" data-key="4">4</button><button class="key" data-key="5">5</button><button class="key" data-key="6">6</button><button class="key" data-key="7">7</button><button class="key" data-key="8">8</button><button class="key" data-key="9">9</button><button class="key special" data-key="back">1字戻す</button><button class="key" data-key="0">0</button><button class="key cross" data-key="x">×</button></div><div class="dialogActions"><button class="cancel" id="clear">空欄</button><button class="cancel" id="cancel">取消</button><button class="confirm" id="ok">決定</button></div></dialog>
<script>
const cells=[...document.querySelectorAll('.score')],values=Array.from({length:2},()=>Array(9).fill(''));let active=null,draft='';const dlg=document.getElementById('dlg'),entry=document.getElementById('entry');
function render(){cells.forEach(b=>{let t=+b.dataset.team,i=+b.dataset.inning;b.textContent=values[t][i]});for(let t=0;t<2;t++)document.getElementById('total'+t).textContent=values[t].reduce((s,v)=>s+(v!==''&&v!=='×'&&!isNaN(Number(v))?Number(v):0),0);try{localStorage.setItem('baseballScoreboard',JSON.stringify({values,names:[team0.value,team1.value]}))}catch(e){}}
function show(){entry.textContent=draft}cells.forEach(b=>b.addEventListener('click',()=>{active={t:+b.dataset.team,i:+b.dataset.inning};draft=values[active.t][active.i];dlg.showModal();show()}));
document.querySelectorAll('[data-key]').forEach(b=>b.addEventListener('click',()=>{let k=b.dataset.key;if(k==='x')draft='×';else if(k==='back')draft=draft==='×'?'':draft.slice(0,-1);else if(draft!=='×'&&draft.length<2)draft+=k;show()}));
document.getElementById('ok').onclick=()=>{if(active){values[active.t][active.i]=draft;render()}dlg.close()};document.getElementById('clear').onclick=()=>{if(active){values[active.t][active.i]='';render()}dlg.close()};document.getElementById('cancel').onclick=()=>dlg.close();
document.getElementById('reset').onclick=()=>{if(confirm('スコアをすべてリセットしますか？')){values.forEach(r=>r.fill(''));team0.value='先攻';team1.value='後攻';render()}};document.querySelectorAll('.teamname').forEach(x=>x.addEventListener('input',render));
try{let s=JSON.parse(localStorage.getItem('baseballScoreboard')||'null');if(s){if(s.values)s.values.forEach((r,t)=>r.forEach((v,i)=>values[t][i]=v));if(s.names){team0.value=s.names[0]||'先攻';team1.value=s.names[1]||'後攻'}}}catch(e){}render();
</script></body></html>
